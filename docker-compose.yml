version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: disporapar_postgres
    environment:
      POSTGRES_USER: disporapar_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: disporapar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_disporapar:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disporapar_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_disporapar:

